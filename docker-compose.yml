services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: infra
      POSTGRES_USER: siaituser
      POSTGRES_PASSWORD: pass123
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:7
    restart: always
    command: ["valkey-server"]
    volumes:
      - valkeydata:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env.prod
    depends_on:
      - postgres
      - valkey
    expose:
      - "8911"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    expose:
      - "80"

  nginx:
    image: nginx:latest
    restart: always
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl

volumes:
  pgdata:
  valkeydata:
