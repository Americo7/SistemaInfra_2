user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;

    # Definimos los "Upstreams" usando los nombres de servicio de Docker Compose
    upstream api_upstream {
        server api:8911;
    }

    upstream web_upstream {
        server web:80;
    }

    server {
        listen 80;
        # Usa el nombre real o localhost. La línea que tenías antes estaba mal formada.
        server_name datainfra-uit.agetic.gob.bo localhost;

        # --- FRONTEND WEB ---
        location / {
            # En Docker, el Nginx principal NO tiene los archivos, así que
            # NO usamos 'root' ni 'try_files' aquí.
            # Se lo pasamos al contenedor 'web' que sí tiene los archivos.
            proxy_pass http://web_upstream;
            
            # Pasamos los headers para que la aplicación sepa quién es el cliente real
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- BACKEND API ---
        location /api/ {
            # IMPORTANTE: Replicamos el rewrite de tu config on-premise.
            # Esto quita "/api/" de la URL antes de enviarla al backend.
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://api_upstream;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
        
        # Logs (Opcional: redirigir a stdout/stderr para verlos con 'docker logs')
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }
}