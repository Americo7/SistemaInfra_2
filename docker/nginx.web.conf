server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Esta es la magia para que React/Redwood funcione al recargar página
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Cachear estáticos para mejorar performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}